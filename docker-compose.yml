version: '3.8'

services:
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: flatra
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: flatra
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  app:
    build: .
    depends_on:
      - db
    env_file:
      - .env.production
    ports:
      - "3000:3000"
    restart: unless-stopped
    volumes:
      - ./:/app:ro

volumes:
  db-data:
